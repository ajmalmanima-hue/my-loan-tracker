<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2937"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>My Loan Tracker</title></head><body>
<header><div><h1>My Loan Tracker</h1><p>Cloud database • EMI & interest-only</p></div><div id="userArea" class="hidden"><span id="userEmail"></span><button id="logoutBtn">Log out</button></div></header>
<div id="notice" class="notice hidden"></div>
<section id="auth" class="auth"><div class="card"><h2 id="authTitle">Sign in</h2><p id="authMsg">Your records are stored in your private Supabase database.</p><form id="authForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="primary" type="submit" id="authBtn">Sign in</button></form><button type="button" class="link" id="toggle">Create a new account</button> 
<main id="app" class="hidden"><section class="summary"><div class="card"><span>Total Outstanding</span><strong id="total">₹0</strong></div><div class="card"><span>EMI Loans</span><strong id="emiTotal">₹0</strong></div><div class="card"><span>Interest Only</span><strong id="intTotal">₹0</strong></div><div class="card"><span>Interest Due</span><strong id="dueTotal">₹0</strong></div></section>
<div class="bar"><h2>My Loans</h2><div><button id="backup">Backup</button><button class="primary" id="add">+ Add Loan</button></div></div><div id="loans"></div>
<section id="loanSec" class="hidden"><h2 id="loanTitle">Add Loan</h2><form id="loanForm" class="card"><label>Loan name<input id="name" required placeholder="Agricultural Loan"></label><label>Loan type<select id="type"><option value="interest">Interest Only / Yearly Renewal</option><option value="emi">EMI Loan</option></select></label><label>Current principal (₹)<input id="principal" type="number" min="0" step=".01" required></label><label>Interest rate (% p.a.)<input id="rate" type="number" min="0" step=".01" required></label><div id="emiFields" class="hidden"><label>Monthly EMI (₹)<input id="emi" type="number" min="0" step=".01"></label></div><div id="intFields"><label>Frequency<select id="frequency"><option value="yearly">Yearly</option><option value="halfyearly">Half-yearly</option><option value="quarterly">Quarterly</option></select></label><label>Next due date<input id="dueDate" type="date"></label></div><label>Notes<input id="notes"></label><button class="primary">Save Loan</button> <button type="button" id="cancelLoan">Cancel</button></form></section>
<section id="paySec" class="hidden"><h2>Record Payment</h2><form id="payForm" class="card"><b id="payLoanName"></b><input id="payLoanId" type="hidden"><label>Date<input id="payDate" type="date" required></label><label>Amount (₹)<input id="amount" type="number" min="0" step=".01" required></label><label>Type<select id="payType"><option value="interest">Interest</option><option value="principal">Principal</option></select></label><label>Note<input id="payNote"></label><button class="primary">Record Payment</button> <button type="button" id="cancelPay">Cancel</button></form></section></main>
<footer>V2 • Loan records are stored in Supabase PostgreSQL.</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
